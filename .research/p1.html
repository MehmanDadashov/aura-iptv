<script>
function cmpBekle(cb, sure){
	if(sure===undefined) sure=2000;
	var bitti=false, baglandi=false, yanitVar=false, kaynak=null, dinleyici=null;
	function git(){
		if(bitti) return; bitti=true;
		try{ window.removeEventListener('message', cevap); }catch(e){}
		try{ if(dinleyici!==null){ if(kaynak.f) kaynak.f('removeEventListener', 2, function(){}, dinleyici); else kaynak.loc.postMessage({__tcfapiCall:{command:'removeEventListener', version:2, parameter:dinleyici, callId:'cmpBekle-sil'}}, '*'); } }catch(e){}
		cb();
	}
	if(sure<=0){ git(); return; }
	setTimeout(function(){ if(!yanitVar) git(); }, sure);
	function bul(){
		var w=window;
		for(var i=0;i<10;i++){
			try{ if(typeof w.__tcfapi==='function') return {f:w.__tcfapi}; }catch(e){}
			try{ if(w.frames['__tcfapiLocator']) return {loc:w}; }catch(e){}
			if(w===window.top) break;
			w=w.parent;
		}
		return null;
	}
	function olay(d, ok){
		if(!d || ok===false) return;
		yanitVar=true;
		if(d.listenerId!==undefined && d.listenerId!==null) dinleyici=d.listenerId;
		if(d.gdprApplies===false || d.eventStatus==='tcloaded' || d.eventStatus==='useractioncomplete') git();
	}
	function cevap(e){
		var d=e.data;
		if(typeof d==='string'){ try{ d=JSON.parse(d); }catch(x){ return; } }
		if(d && d.__tcfapiReturn && d.__tcfapiReturn.callId==='cmpBekle-ol') olay(d.__tcfapiReturn.returnValue, d.__tcfapiReturn.success);
	}
	window.addEventListener('message', cevap);
	(function bagla(){
		if(bitti || baglandi) return;
		kaynak=bul();
		if(kaynak){
			baglandi=true;
			if(kaynak.f){ try{ kaynak.f('addEventListener', 2, olay); }catch(e){ baglandi=false; } }
			else{ try{ kaynak.loc.postMessage({__tcfapiCall:{command:'addEventListener', version:2, callId:'cmpBekle-ol'}}, '*'); }catch(e){ baglandi=false; } }
		}
		if(!baglandi) setTimeout(bagla, 100);
	})();
}
